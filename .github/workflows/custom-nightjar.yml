name: Nightjar custom APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'protocol -> target'
      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android
      - name: Load persistent custom signing certificate
        shell: bash
        env:
          CUSTOM_NIGHTJAR_KEYSTORE_B64: ${{ secrets.CUSTOM_NIGHTJAR_KEYSTORE_B64 }}
          CUSTOM_NIGHTJAR_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_NIGHTJAR_KEYSTORE_PASSWORD }}
          CUSTOM_NIGHTJAR_KEY_ALIAS: ${{ secrets.CUSTOM_NIGHTJAR_KEY_ALIAS }}
          CUSTOM_NIGHTJAR_KEY_PASSWORD: ${{ secrets.CUSTOM_NIGHTJAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in CUSTOM_NIGHTJAR_KEYSTORE_B64 CUSTOM_NIGHTJAR_KEYSTORE_PASSWORD CUSTOM_NIGHTJAR_KEY_ALIAS CUSTOM_NIGHTJAR_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              exit 1
            fi
          done
          printf '%s' "$CUSTOM_NIGHTJAR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nightjar-custom.p12"
          chmod 600 "$RUNNER_TEMP/nightjar-custom.p12"
      - name: Build signed arm64 custom Nightjar
        shell: bash
        env:
          BP_KEYSTORE: ${{ runner.temp }}/nightjar-custom.p12
          BP_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_NIGHTJAR_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.CUSTOM_NIGHTJAR_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.CUSTOM_NIGHTJAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=4 -PabiFilters=arm64-v8a :app:assembleNonRootCustom
          apk="app/build/outputs/apk/nonRoot/custom/app-nonRoot-custom.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -m 1 '^package:'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-256 digest:'
          mkdir -p output
          cp "$apk" output/nightjar-5.2.0-custom-arm64.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nightjar-custom.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightjar-custom-arm64
          path: output/nightjar-5.2.0-custom-arm64.apk
          if-no-files-found: error
          retention-days: 30
