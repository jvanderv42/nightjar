name: Nightjar custom universal release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/custom-nightjar-universal.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightjar-custom-signing
  cancel-in-progress: false

jobs:
  universal-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'protocol -> target'
      - name: Install all Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Restore the existing custom signing key
        shell: bash
        env:
          CUSTOM_NIGHTJAR_SIGNING_PASSWORD: ${{ secrets.CUSTOM_NIGHTJAR_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${#CUSTOM_NIGHTJAR_SIGNING_PASSWORD}" -lt 24 ]; then
            echo '::error::Missing or invalid CUSTOM_NIGHTJAR_SIGNING_PASSWORD repository secret.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          chmod 700 "$RUNNER_TEMP/signing"
          # Fail closed if the original key was lost. Never silently rotate a released app's identity.
          git fetch --no-tags --depth=1 origin refs/heads/custom-signing-key
          git show FETCH_HEAD:nightjar-custom.p12.enc > "$RUNNER_TEMP/signing/nightjar-custom.p12.enc"
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/signing/nightjar-custom.p12.enc" \
            -out "$RUNNER_TEMP/signing/nightjar-custom.p12" \
            -pass env:CUSTOM_NIGHTJAR_SIGNING_PASSWORD
          keytool -list -keystore "$RUNNER_TEMP/signing/nightjar-custom.p12" \
            -storepass "$CUSTOM_NIGHTJAR_SIGNING_PASSWORD" \
            -alias nightjarCustom -v | grep 'SHA256:'
      - name: Build and verify universal custom APK
        shell: bash
        env:
          BP_KEYSTORE: ${{ runner.temp }}/signing/nightjar-custom.p12
          BP_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_NIGHTJAR_SIGNING_PASSWORD }}
          BP_KEY_ALIAS: nightjarCustom
          BP_KEY_PASSWORD: ${{ secrets.CUSTOM_NIGHTJAR_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=4 :app:assembleNonRootCustom
          apk="app/build/outputs/apk/nonRoot/custom/app-nonRoot-custom.apk"
          test -s "$apk"
          info=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -m 1 '^package:')
          echo "$info"
          [[ "$info" == *"name='com.butterpollo.client.custom'"* ]] || {
            echo '::error::Incorrect package ID'
            exit 1
          }
          [[ "$info" == *"versionCode='391'"* ]] || {
            echo '::error::Unexpected version code'
            exit 1
          }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libnightjar_core.so" >/dev/null || {
              echo "::error::Missing native streaming engine for $abi"
              exit 1
            }
            echo "Verified native streaming engine for $abi"
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            grep 'Signer #1 certificate SHA-256 digest:'
          mkdir -p dist
          cp "$apk" dist/nightjar-5.2.0-custom-universal.apk
          (cd dist && sha256sum nightjar-5.2.0-custom-universal.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Remove private signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightjar-custom-universal
          path: |
            dist/nightjar-5.2.0-custom-universal.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish to this fork's GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="custom-5.2.0-1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Refusing to overwrite a publicly published APK."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Nightjar Custom 5.2.0 — Universal Android APK

          Unofficial, community-built Nightjar 5.2.0 based on the open-source
          Nightjar project by RamazanKara, with custom controller gyro work.

          - Flydigi Apex 4 and Vader 4 Pro gyro profiles and manual selection
          - Custom gyro mappings and independent horizontal/vertical sensitivity
          - Optional gyro diagnostics (off by default)
          - Non-debuggable optimized Android build for ARM64, ARMv7, x86 and x86_64
          - Launcher name: **Nightjar**; Android package: `com.butterpollo.client.custom`

          ### Installation and updates

          Install the APK normally. It installs **alongside** an official Nightjar
          installation without changing its settings or pairing. Pair your PC with
          the custom installation once. Subsequent custom releases signed with the
          same certificate can update it in place.

          This fork's signing certificate is **not** the official Nightjar signing
          certificate. It cannot replace or update the official Nightjar package.
          This release was built by GitHub Actions; additional ABIs were packaged
          and checked but have not been individually tested on physical devices.

          Source: https://github.com/jvanderv42/nightjar
          Original project: https://github.com/RamazanKara/nightjar
          NOTES
          gh release create "$tag" \
            dist/nightjar-5.2.0-custom-universal.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Nightjar Custom 5.2.0 (Universal Android)' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest=false
